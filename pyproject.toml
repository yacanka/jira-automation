[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jira-test-automation"
version = "0.1.0"
description = "Component-based Jira Data Center explorer and Selenium test toolkit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["selenium>=4.27,<5", "pytest>=8,<10", "requests>=2.32,<3", "PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["ruff>=0.8", "mypy>=1.13", "build>=1.2", "types-PyYAML", "types-requests"]

[project.scripts]
jira-test = "jira_test.cli:main"

[project.entry-points.pytest11]
jira_test = "jira_test.pytest_plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["live: requires configured Jira instance"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
no_implicit_optional = true
